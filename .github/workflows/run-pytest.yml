name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and its test dependencies
        run: python -m pip install -e ".[test]"

      # Known-broken tests are excluded so that the badge only reports new regressions.
      # Remove each entry once its test is fixed or deleted:
      #   - test_aero_buildup, test_vlm, test_vortex_lattice_method: removed old API
      #     (arb.Airplane, LiftingSet, VortexLatticeMethod)
      #   - test_kulfanairfoil_similarity: NaN in airfoil_families.py
      #   - test_black_box_extended: solver fails on the nonsmooth function
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: >-
          python -m pytest archibald -q --tb=short
          --ignore=archibald/dynamics/aero_3D/test_aero_3D/test_aero_buildup/test_basic.py
          --ignore=archibald/dynamics/aero_3D/test_aero_3D/test_aero_buildup/test_moment_validation/test_wing_moment_and_derivatives.py
          --ignore=archibald/dynamics/aero_3D/test_aero_3D/test_aero_buildup/test_trefftz_plane_wake_continuity.py
          --ignore=archibald/dynamics/aero_3D/test_aero_3D/test_vlm/test_operating_point_optimization.py
          --deselect=archibald/dynamics/aero_3D/test_aero_3D/test_aero_buildup/test_fuselage_aerodynamics_optimization.py::test_fuselage_aerodynamics_optimization
          --deselect=archibald/dynamics/aero_3D/test_aero_3D/test_aero_buildup/test_fuselage_cylinder_crossflow_limit.py::test_90_deg_crossflow
          --deselect=archibald/dynamics/aero_3D/test_aero_3D/test_aero_buildup/test_moment_validation/test_fuselage_moment_and_derivatives.py::test_derivatives_at_zero_geometric_angles
          --deselect=archibald/dynamics/aero_3D/test_aero_3D/test_aero_buildup/test_moment_validation/test_fuselage_moment_and_derivatives.py::test_derivatives_at_constant_offset
          --deselect=archibald/dynamics/aero_3D/test_aero_3D/test_aero_buildup/test_moment_validation/test_fuselage_moment_and_derivatives.py::test_derivatives_at_incidence
          --deselect=archibald/dynamics/aero_3D/test_aero_3D/test_aero_buildup/test_moment_validation/test_fuselage_moment_and_derivatives.py::test_cambered_fuselage
          --deselect=archibald/dynamics/aero_3D/test_aero_3D/test_aero_buildup/test_moment_validation/test_fuselage_moment_and_derivatives.py::test_fuselage_with_base_drag
          --deselect=archibald/dynamics/aero_3D/test_aero_3D/test_vlm/test_airplane_optimization.py::test_airplane_optimization
          --deselect=archibald/dynamics/aero_3D/test_aero_3D/test_vortex_lattice_method.py::test_conventional
          --deselect=archibald/dynamics/aero_3D/test_aero_3D/test_vortex_lattice_method.py::test_vanilla
          --deselect=archibald/dynamics/aero_3D/test_aero_3D/test_vortex_lattice_method.py::test_flat_plate
          --deselect=archibald/dynamics/aero_3D/test_aero_3D/test_vortex_lattice_method.py::test_flat_plate_mirrored
          --deselect=archibald/geometry/airfoil/test_airfoil/test_kulfanairfoil_similarity.py::test_TE_angle
          --deselect=archibald/geometry/airfoil/test_airfoil/test_kulfanairfoil_similarity.py::test_LE_radius
          --deselect=archibald/geometry/airfoil/test_airfoil/test_kulfanairfoil_similarity.py::test_area
          --deselect=archibald/modeling/test_modeling/test_black_box_extended.py::test_black_box_nonsmooth_function
