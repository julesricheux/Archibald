name: Publish Archibald to PyPI

on:
  push:
    tags:
      - 'v*' # Triggers on release tags like v0.1.0, v1.0.0

jobs:
  build:
    name: Build distribution package 📦
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      # Build exclusively from the ./archibald subdirectory
      - name: Build binary wheel and source tarball
        run: python -m build archibald/ --outdir dist/

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python distribution 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/archibald
    permissions:
      id-token: write # MANDATORY for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
