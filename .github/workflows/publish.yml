name: Publish Archibald to PyPI

on:
  push:
    tags:
      - 'v*'  # e.g. v0.1.4
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git tag or commit to build and publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distribution package 📦
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify tag matches package version
        env:
          REF: ${{ github.event.inputs.git_ref || github.ref_name }}
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$REF" == v* ]]; then
            TAG_VERSION="${REF#v}"
            echo "tag=$TAG_VERSION package=$PKG_VERSION"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) does not match pyproject version ($PKG_VERSION)"
              exit 1
            fi
          else
            echo "Ref '$REF' is not a version tag; skipping check (package=$PKG_VERSION)"
          fi

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine

      # pyproject.toml is at the repo root, so build from the root
      - name: Build wheel and source tarball
        run: python -m build --outdir dist/

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python distribution 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/archibald-design
    permissions:
      id-token: write  # MANDATORY for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
