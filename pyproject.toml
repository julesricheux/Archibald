[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archibald-design"
version = "2.1.0"       # must match the release tag: v2.1.0
description = "An open-source differentiable performance prediction program (PPP) for sailboats and ships in the preliminary design stage."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jules Richeux", email = "j.richeux@neoline.eu" }
]
keywords = ["ship", "design", "naval", "architecture", "vpp", "ppp", "velocity", "power", "prediction", "program", "python", "optimization", "performance", "sailing", "motor", "hybrid", "skiff", "sailboat", "boat", "cargo", "vessel"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "sympy",
    "casadi",
    "trimesh",
    "ezdxf",
    "mapbox-earcut",
    "polars",
    "sortedcontainers",
    "dill",
    "neuralfoil",
	"xarray",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/julesricheux/Archibald"
Repository = "https://github.com/julesricheux/Archibald"
Issues = "https://github.com/julesricheux/Archibald/issues"

[tool.setuptools.packages.find]
include = ["archibald*"]
exclude = ["*tests*"]