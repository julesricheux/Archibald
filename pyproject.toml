[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archibald-vpp"  # PyPI name; the import name stays `archibald`
version = "2.1.0"       # must match the release tag: v2.1.0
description = "Core computational and geometry processing library for Archibald."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jules Richeux", email = "j.richeux@neoline.eu" }
]
keywords = ["vpp", "geometry", "mesh"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "sympy",
    "casadi",
    "trimesh",
    "ezdxf",
    "mapbox-earcut",
    "polars",
    "sortedcontainers",
    "dill",
    "neuralfoil",
]

[project.urls]
Homepage = "https://github.com/julesricheux/Archibald"
Repository = "https://github.com/julesricheux/Archibald"
Issues = "https://github.com/julesricheux/Archibald/issues"

[tool.setuptools.packages.find]
include = ["archibald*"]
exclude = ["*tests*"]
